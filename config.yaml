camera:
  index: 0
  width: 1280
  height: 720
  window_name: "Air Drawing"

drawing:
  main_color: [255, 0, 0]
  brush_thickness: 8
  text_block_color: [255, 255, 0]
  banner_alpha: 0.4
  confidence_threshold: 0.7

gestures:
  swipe_distance_threshold: 0.12
  swipe_ratio_threshold: 1.3
  swipe_time_window: 0.4
  swipe_cooldown: 0.8
  backspace_cooldown: 0.6